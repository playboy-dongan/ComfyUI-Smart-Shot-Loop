name: Publish to Comfy Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  publish-node:
    name: Validate and publish custom node
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Python nodes
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate frontend controller
        run: node --test tests/*.test.mjs
      - name: Check publishing secret is configured
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo 'REGISTRY_ACCESS_TOKEN is not configured. Add the publisher key through GitHub repository settings.'
            exit 1
          fi
      - name: Publish with the official Comfy action
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          skip_checkout: 'true'
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
